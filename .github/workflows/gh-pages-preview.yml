name: GitHub Pages Preview (temporary, not production)

# Manual-only. This exists solely so the site's current state is viewable
# somewhere while the Vercel account's daily deploy quota resets — it does
# NOT touch ewastekochi.com's DNS or replace the real Vercel deployment.
# Safe to delete once Vercel deploys are unblocked again.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (project-path base for GitHub Pages)
        run: npm run build
        env:
          GH_PAGES_BASE: /${{ github.event.repository.name }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
