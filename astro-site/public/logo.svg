<svg xmlns="http://www.w3.org/2000/svg" width="220" height="60" viewBox="0 0 220 60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&amp;display=swap');
      .text-ewaste {
        font-family: 'Outfit', sans-serif;
        font-size: 24px;
        font-weight: 900;
        fill: #0f172a;
        letter-spacing: -0.5px;
      }
      .text-kochi {
        font-family: 'Outfit', sans-serif;
        font-size: 24px;
        font-weight: 400;
        fill: #10b981;
        letter-spacing: 0px;
      }
      .text-sub {
        font-family: 'Outfit', sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        fill: #64748b;
        letter-spacing: 2.2px;
      }
      .mark-grad-1 { fill: url(#grad1); }
      .mark-grad-2 { fill: url(#grad2); }
      .mark-grad-3 { fill: url(#grad3); }
    </style>
    
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="grad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- The Mark (Geometric Circuit/Recycle) -->
  <g transform="translate(4, 8)" filter="url(#shadow)">
    <!-- Tech node/leaf base -->
    <path class="mark-grad-1" d="M22,2 A20,20 0 0,0 2,22 A20,20 0 0,0 22,42 L22,30 A8,8 0 0,1 14,22 A8,8 0 0,1 22,14 Z" />
    
    <!-- Top circuit trace -->
    <path class="mark-grad-2" d="M22,2 C33.045,2 42,10.955 42,22 L30,22 C30,17.58 26.42,14 22,14 Z" />
    
    <!-- Bottom right leaf curve -->
    <path class="mark-grad-3" d="M42,22 C42,33.045 33.045,42 22,42 L22,30 C26.42,30 30,26.42 30,22 Z" />
    
    <!-- Center node -->
    <circle fill="#ffffff" cx="22" cy="22" r="4" />
  </g>

  <!-- Text -->
  <text x="56" y="32">
    <tspan class="text-ewaste">EWASTE</tspan>
    <tspan class="text-kochi"> KOCHI</tspan>
  </text>
  <text x="58" y="47" class="text-sub">CERTIFIED RECYCLING</text>
</svg>
